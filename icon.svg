<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Felix · Notes de terrain — a fine-line pen sketch: a spiral notebook lying at an angle
       (axonometric, leaning left), a mountain with a dashed ski track. Black and white only. -->
  <g transform="matrix(0.7197 -0.2755 0.3827 0.5182 -6.39 23.77)" fill="none" stroke="#111111" stroke-linecap="round" stroke-linejoin="round">
  <!-- page stack: a few page edges peeking out below and to the right (thickness) -->
  <g stroke-width="0.35" opacity="0.85">
    <path d="M14.6 60.1 C28 60.8, 44 59.9, 58.4 60.4 L58.8 7.4"/>
    <path d="M15.4 61.6 C29 62.2, 45 61.4, 59.6 61.9 L60 8.8"/>
    <path d="M16.2 63.0 C30 63.5, 46 62.8, 60.8 63.3 L61.2 10.2"/>
  </g>
  <!-- the page: two quick passes of the pen -->
  <path d="M14.2 6.2 C25 5.4, 42 6.6, 56.8 5.8 C57.4 21, 56.7 42, 57.4 58.6 C43 59.4, 27 58.4, 13.6 59.2 C12.9 44, 13.7 23, 14.2 6.2 Z" fill="#ffffff" stroke-width="0.75"/>
  <path d="M14.8 5.6 C27 6.4, 43 5.2, 57.3 6.4 M57 40 C57.3 48, 56.9 53, 57.6 59.1" stroke-width="0.30" opacity="0.7"/>
  <!-- spiral binding: seven small loops -->
  <g stroke-width="0.55">
    <path d="M10.4 13.2 C9.2 10.4, 13.8 9.6, 16.8 11.4"/><path d="M10.4 20.2 C9.2 17.4, 13.8 16.6, 16.8 18.4"/><path d="M10.4 27.2 C9.2 24.4, 13.8 23.6, 16.8 25.4"/><path d="M10.4 34.2 C9.2 31.4, 13.8 30.6, 16.8 32.4"/><path d="M10.4 41.2 C9.2 38.4, 13.8 37.6, 16.8 39.4"/><path d="M10.4 48.2 C9.2 45.4, 13.8 44.6, 16.8 46.4"/><path d="M10.4 55.2 C9.2 52.4, 13.8 51.6, 16.8 53.4"/>
  </g>
  <!-- the mountain: main peak and a shoulder -->
  <path d="M19 49.5 L26.6 36.2 L30.2 40.8 L38.4 17.2 L52.6 49.2" stroke-width="0.80"/>
  <path d="M24.4 49.6 L29.4 44.2" stroke-width="0.40"/>
  <!-- snow line and hatching on the shadow face -->
  <path d="M35.2 26.8 L36.8 28.4 L38.2 26.6 L39.8 28.8 L41.6 26.4" stroke-width="0.45"/>
  <g stroke-width="0.35" opacity="0.9"><path d="M40.4 22.6 L44.2 31.2"/><path d="M40.6 27.8 L45.4 38.6"/><path d="M41.4 33.6 L46.8 45.8"/><path d="M43.2 41.4 L46 47.8"/><path d="M41.6 24.4 L43.6 29"/></g>
  <!-- the ski line: a dashed track in wide turns -->
  <path d="M38.2 19.8 C34.6 24.6, 41.6 27.2, 38.8 32.2 C35.8 37.4, 43.6 39.6, 40.2 46.6" stroke-width="0.60" stroke-dasharray="1.6 1.2"/>
  <!-- scribbled notes at the bottom of the page -->
  <g stroke-width="0.35" opacity="0.75">
    <path d="M19 53.4 C21 52.6, 23 54.2, 25 53.4 S29 52.6, 31 53.4 S35 54.2, 37 53.2"/>
    <path d="M19 56 C21.4 55.2, 23.4 56.8, 25.6 56 S29.6 55.3, 31.4 56"/>
  </g>
</g>
</svg>