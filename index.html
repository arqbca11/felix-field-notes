<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felix — Notes de terrain</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<!-- Entry index (which entries exist + their order). Entries themselves load from notes/*.js -->
<script src="engine/sentences.js"></script>
<script src="notes/manifest.js"></script>
<style>
  :root{
    --ink:#000000; --soft:#4a4a4a; --muted:#8a8a8a;
    --line:#e6e6e6; --wash:#f4f4f4;
    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:#fff;color:var(--ink);font-family:var(--serif);line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}

  /* TOP LINE: name on the left, reading controls on the right */
  .top{max-width:720px;margin:0 auto;padding:26px 24px 0;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--sans);font-size:12px;color:var(--muted);}
  .top .name{color:var(--ink);letter-spacing:.2px;}
  .controls{position:fixed;top:0;right:0;z-index:1000;display:flex;flex-direction:column;align-items:flex-end;padding:22px 24px 0 0;font-family:var(--sans);font-size:12px;color:var(--muted);pointer-events:none;}
  .controls > *{pointer-events:auto;}
  .top-right{display:flex;align-items:baseline;gap:14px;background:#fff;padding:4px 0 6px 12px;}
  .readbar{display:none;align-items:baseline;gap:14px;}
  .learn-btn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);}
  .learn-btn:hover,body.learn .learn-btn{color:var(--ink);text-decoration-color:var(--ink);}
  /* Learn mode: everything about language learning is hidden unless body.learn is set */
  body:not(.learn) .learn-only{display:none !important;}
  body:not(.learn) .article p{padding-left:0;}
  .rb-link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);}
  .rb-link:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .key-entry,.voice-picker{display:none;width:min(340px,calc(100vw - 36px));margin-top:8px;padding:12px 14px 13px;background:#fff;border:1px solid var(--line);font-family:var(--sans);font-size:13px;color:var(--soft);}
  .ke-label{margin-bottom:8px;}
  .ke-label span{color:var(--muted);}
  .ke-row{display:flex;gap:8px;}
  .ke-input{flex:1;border:1px solid var(--line);padding:8px 10px;font:inherit;color:var(--ink);background:#fff;outline:none;}
  .ke-input:focus{border-color:var(--ink);}
  .ke-btn{border:1px solid var(--ink);padding:0 14px;}
  .ke-msg{color:#a33;margin-top:6px;min-height:14px;}
  .vp-label{color:var(--muted);margin-bottom:8px;}
  .vp-list{display:flex;flex-direction:column;max-height:230px;overflow-y:auto;border-top:1px solid var(--line);}
  .vitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .vdot{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink);flex-shrink:0;}
  .vitem.selected .vdot{background:var(--ink);}
  .vinfo{flex:1;min-width:0;}
  .vname{color:var(--ink);}
  .vmeta{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .vprev{width:24px;height:24px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vprev:hover{color:var(--ink);}
  .vprev svg{width:10px;height:10px;}
  .vp-msg{color:var(--muted);margin-top:8px;min-height:14px;}

  /* FEED — one column; an entry widens to two columns when translation/notes are open */
  .feed{max-width:1180px;margin:0 auto;padding:36px 24px 120px;}
  .post{max-width:672px;margin:0 auto;padding:44px 0 48px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:minmax(0,1fr);column-gap:56px;scroll-margin-top:20px;}
  .post:first-child{border-top:none;padding-top:10px;}
  .post.split{max-width:1132px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .post-head{grid-column:1/-1;}
  .post.split .article{grid-column:1;grid-row:2;}
  .post.split .post-side{grid-column:2;grid-row:2;}

  .post-meta{display:flex;flex-wrap:wrap;gap:0 10px;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.2px;}
  .post-meta .pdate{color:var(--ink);}
  .post-meta .pdate::first-letter{text-transform:uppercase;}
  .post h2{font-weight:400;font-size:27px;line-height:1.2;letter-spacing:-.2px;margin:12px 0 0;}
  .post h2 .en-title{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.2px;}
  .post-actions{display:flex;flex-wrap:wrap;gap:0 18px;margin-top:14px;font-family:var(--sans);font-size:12.5px;}
  .act{color:var(--soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);padding:2px 0;}
  .act:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .act.on,.act.playing{color:var(--ink);text-decoration-color:var(--ink);}
  .post.note .post-actions{grid-column:1/-1;order:3;margin-top:16px;}

  .article{font-size:20px;line-height:1.72;margin-top:22px;min-width:0;}
  .post.note .article{margin-top:14px;}
  .article p{position:relative;padding:2px 0 2px 34px;margin:0 0 14px;transition:background .2s;}
  .article p:last-child{margin-bottom:0;}
  .article p.speaking{background:var(--wash);box-shadow:0 0 0 6px var(--wash);}
  .pp-btn,.dict-btn{position:absolute;left:0;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:.55;transition:all .15s;}
  .pp-btn{top:8px;} .dict-btn{top:32px;}
  .pp-btn:hover,.dict-btn:hover{opacity:1;border-color:var(--ink);color:var(--ink);}
  .pp-btn.playing,.dict-btn.on{opacity:1;background:var(--ink);border-color:var(--ink);color:#fff;}
  .pp-btn svg{width:9px;height:9px;} .dict-btn svg{width:10px;height:10px;}

  /* DICTATION (per-paragraph) */
  .dictation{display:none;}
  .article p.dictating .ptext{display:none;}
  .article p.dictating .dictation{display:block;}
  .dict-input{width:100%;border:1px solid var(--line);padding:10px 12px;background:#fff;font-family:var(--serif);font-size:18px;line-height:1.6;color:var(--ink);outline:none;resize:vertical;}
  .dict-input:focus{border-color:var(--ink);}
  .dict-actions{display:flex;gap:16px;margin-top:8px;font-family:var(--sans);font-size:12.5px;}
  .dict-check,.dict-reveal{color:var(--soft);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);}
  .dict-check{color:var(--ink);text-decoration-color:var(--ink);}
  .dict-check:hover,.dict-reveal:hover{color:var(--ink);text-decoration-color:var(--ink);}
  .dict-result{display:none;margin-top:12px;}
  .dict-result.open{display:block;}
  .dict-score{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink);margin-bottom:4px;}
  .dict-lbl{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin:8px 0 2px;letter-spacing:.3px;}
  .dict-line{display:block;font-size:17px;line-height:1.65;}
  .dict-msg{display:block;font-style:italic;font-size:15px;color:var(--muted);}
  .w-ok{color:var(--ink);}
  .w-miss{color:#a33;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:2px;}
  .w-bad{color:#a33;text-decoration:line-through;}

  .post-side{display:none;min-width:0;}
  .post.split .post-side{display:flex;flex-direction:column;gap:28px;margin-top:22px;}
  .post.note.split .post-side{margin-top:14px;}

  .en-block{display:none;font-size:17px;line-height:1.68;color:var(--soft);}
  .en-block.open{display:block;}
  .en-block p{margin-bottom:12px;}
  .en-block p:last-child{margin-bottom:0;}

  /* SIMPLIFY — click a sentence on the left, its A1/A2 version appears on the right */
  .post.simple-on .sent{cursor:pointer;border-bottom:1px dotted var(--line);transition:background .15s;}
  .post.simple-on .sent:hover{background:var(--wash);box-shadow:0 0 0 3px var(--wash);}
  .post.simple-on .sent.on{background:var(--wash);box-shadow:0 0 0 3px var(--wash);border-bottom-color:var(--ink);}
  .simple-block{display:none;}
  .simple-block.open{display:block;}
  .simple-hint{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .simple-block.has-items .simple-hint{display:none;}
  .simp-para{margin:0 0 14px;}
  .simp-para:empty{display:none;}
  .simp{position:relative;display:block;padding:2px 0 2px 34px;margin:0 0 12px;}
  .simp:last-child{margin-bottom:0;}
  .simp .pp-btn{top:8px;}
  .simp-fr{display:block;font-size:20px;line-height:1.72;color:var(--ink);}
  .simp-en{display:block;font-size:15px;line-height:1.6;color:var(--soft);margin-top:2px;}

  .notes{display:none;}
  .notes.open{display:block;}
  .nsec-label{font-family:var(--sans);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
  table{width:100%;border-collapse:collapse;margin-bottom:28px;border-top:1px solid var(--line);}
  td{padding:7px 0;font-size:15px;vertical-align:top;border-bottom:1px solid var(--line);}
  td.fr{font-style:italic;width:44%;padding-right:14px;}
  td.en{font-family:var(--sans);font-size:13.5px;color:var(--soft);line-height:1.5;padding-top:8px;}
  .gram{margin-bottom:18px;}
  .gram:last-child{margin-bottom:0;}
  .gram h4{font-family:var(--sans);font-size:13.5px;font-weight:600;margin-bottom:4px;}
  .gram p{font-family:var(--sans);font-size:13.5px;color:var(--soft);line-height:1.6;}
  .gram .ex{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink);}
  .gram .arrow{color:var(--muted);font-style:normal;}

  /* VERB CONJUGATION (vocab) */
  .conj-btn{font-family:var(--sans);font-size:10px;color:var(--muted);margin-left:4px;vertical-align:middle;}
  .conj-btn:hover,.conj-btn.open{color:var(--ink);}
  .conj-row{display:none;}
  .conj-row.open{display:table-row;}
  .conj-row > td{padding:6px 0 14px;}
  .conj-inf{font-style:italic;font-size:15px;margin-bottom:8px;}
  .conj-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;}
  .conj-tname{font-family:var(--sans);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .conj-tense ul{list-style:none;}
  .conj-tense li{font-size:14px;color:var(--soft);line-height:1.5;}

  /* SELECTION DICTIONARY (select French text → quick gloss) */
  .lookup{position:fixed;z-index:1500;max-width:300px;min-width:168px;background:#fff;border:1px solid var(--ink);padding:10px 12px 11px;font-family:var(--sans);display:none;}
  .lookup.open{display:block;}
  .lk-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px;}
  .lk-term{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.25;flex:1;min-width:0;word-break:break-word;}
  .lk-speak{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;}
  .lk-speak:hover{border-color:var(--ink);color:var(--ink);}
  .lk-speak.playing{background:var(--ink);border-color:var(--ink);color:#fff;}
  .lk-speak svg{width:9px;height:9px;}
  .lk-trans{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .lk-trans.none{color:var(--muted);font-family:var(--serif);font-style:italic;}
  .lk-loading{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;}
  .lk-src{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:7px;}
  .lk-sense{margin-top:3px;}
  .lk-pos{color:var(--muted);font-size:10.5px;margin-right:5px;}

  .empty-feed{max-width:672px;margin:0 auto;font-style:italic;color:var(--muted);}

  @keyframes spin{to{transform:rotate(360deg);}}

  @media(max-width:1024px){
    .post.split{max-width:672px;grid-template-columns:minmax(0,1fr);}
    .post.split .article,.post.split .post-side{grid-column:1;grid-row:auto;}
  }
  @media(max-width:600px){
    .top,.feed{padding-left:18px;padding-right:18px;}
    .controls{padding:16px 18px 0 0;}
    .top-right{gap:10px;}
    .article{font-size:18.5px;}
  }
</style>
</head>
<body>

<div class="top">
  <span class="name">Felix · Notes de terrain</span>
</div>
<!-- Fixed to the top-right corner of the viewport: stays put while scrolling -->
<div class="controls" id="controls">
  <div class="top-right">
    <button class="learn-btn" id="learnBtn" onclick="toggleLearn()">Learn</button>
    <div class="readbar learn-only" id="readbar">
      <span>Voix : <span id="rbVoice">—</span></span>
      <button class="rb-link" id="rbSpeed" onclick="cycleSpeed()">1.0×</button>
      <button class="rb-link" id="voiceBtn" onclick="voiceBtnClick()">Changer de voix</button>
    </div>
  </div>
  <div class="key-entry learn-only" id="keyEntry">
    <div class="ke-label">Clé API ElevenLabs <span>(optionnel — sans clé, la voix du navigateur est utilisée)</span></div>
    <div class="ke-row">
      <input class="ke-input" id="keyInput" type="password" placeholder="Collez votre clé API…"/>
      <button class="ke-btn" onclick="saveKey()">Connecter</button>
    </div>
    <div class="ke-msg" id="keyMsg"></div>
  </div>
  <div class="voice-picker learn-only" id="voicePicker">
    <div class="vp-label">Choisir une voix</div>
    <div class="vp-list" id="vpList"></div>
    <div class="vp-msg" id="vpMsg"></div>
  </div>
</div>

<main class="feed" id="feed"></main>

<script>
/* ── ENTRY REGISTRY ─────────────────────────────────────────────────────────
   This file is a TEMPLATE: it carries no entry content. Each entry lives in its
   own resource file under notes/ (text, vocab, grammar) and registers itself by
   calling FelixNotes.register(...). The loader injects every file listed in
   notes/manifest.js and renders ALL entries in chronological order (oldest first).
   See CLAUDE.md §5–§7. */
let POSTS = [];                           // all entries, sorted by `no`
const POST_BY_ID = {};                    // id -> entry object, filled by FelixNotes.register
const LOADED_FILES = new Set();           // entry files already injected (never inject twice)

window.FelixNotes = {
  register(post){ POST_BY_ID[post.id] = post; },
  // Helper for verb vocab entries: build a conjugation object the notes panel can render.
  // Each tense is an array of the 6 persons (je…ils), already including pronoun + auxiliary.
  verb(inf, pres, pc, imp, fut){
    return { inf, conj:[['Présent',pres],['Passé composé',pc],['Imparfait',imp],['Futur simple',fut]] };
  }
};

const KIND_FR = { note:'Note', entry:'Journal', report:'Compte rendu', portrait:'Portrait', memory:'Souvenir', plan:'Projet' };

// Ensure the given manifest entries' scripts are loaded, then run `done`.
// Uses dynamic <script> tags (NOT fetch) so the page works opened directly via file://.
function ensureLoaded(entries, done){
  const todo = entries.filter(e => !LOADED_FILES.has(e.file));
  if(!todo.length){ done(); return; }
  let pending = todo.length;
  const settle = () => { if(--pending === 0) done(); };
  todo.forEach(entry => {
    LOADED_FILES.add(entry.file);
    const s = document.createElement('script');
    s.src = entry.file;
    s.onload = settle;
    s.onerror = () => { console.error('Could not load entry:', entry.file); LOADED_FILES.delete(entry.file); settle(); };
    document.head.appendChild(s);
  });
}

// Load every entry in the manifest and render them, oldest first.
function showAll(){
  const manifest = Array.isArray(window.NOTES_MANIFEST) ? window.NOTES_MANIFEST : [];
  ensureLoaded(manifest, () => {
    stopAll();
    POSTS = manifest.map(e => POST_BY_ID[e.id]).filter(Boolean).sort((a,b)=>a.no-b.no);
    buildFeed();
  });
}

// ── ICONS ──
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>';
const ICON_SPIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" style="animation:spin .8s linear infinite"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
const ICON_PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

// ── SAFE STORAGE ──
// The ElevenLabs key/voice keys are shared with the travel blog on purpose (same origin on GitHub Pages).
const KEY_API='elevenlabs_api_key', KEY_VOICE='elevenlabs_voice_id', KEY_VNAME='elevenlabs_voice_name', KEY_SPEED='felix_notes_speed', KEY_LEARN='felix_notes_learn';
function getLS(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function setLS(k,v){ try{localStorage.setItem(k,v);}catch(e){} }

// ── LEARN MODE ──
// Off = a plain diary page. On = voice controls, level tags, Lire/Traduction/Notes,
// per-paragraph play + dictation, and select-to-translate. Remembered in localStorage.
function setLearn(on){
  document.body.classList.toggle('learn', on);
  setLS(KEY_LEARN, on ? '1' : '0');
  if(!on){
    stopAll(); hideLookup();
    document.querySelectorAll('.en-block.open, .notes.open, .simple-block.open').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.post.simple-on').forEach(p => clearSimple(p));
    document.querySelectorAll('.act.on').forEach(b => b.classList.remove('on'));
    document.querySelectorAll('.post.split').forEach(p => p.classList.remove('split'));
    document.querySelectorAll('.article p.dictating').forEach(p => p.classList.remove('dictating'));
    document.querySelectorAll('.dict-btn.on').forEach(b => b.classList.remove('on'));
    document.getElementById('keyEntry').style.display='none';
    document.getElementById('voicePicker').style.display='none'; pickerOpen=false;
  }
}
function toggleLearn(){ setLearn(!document.body.classList.contains('learn')); }

// ── DATES ──
const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const DAYS_FR = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function frFull(isoStr){                         // "dimanche 20 septembre 2026"
  const [y,mo,d]=isoStr.split('-').map(Number);
  const dow = DAYS_FR[new Date(y,mo-1,d).getDay()];
  return `${dow} ${d}${d===1?'er':''} ${MONTHS_FR[mo-1]} ${y}`;
}

// ── BUILD FEED ──
const feed = document.getElementById('feed');
function buildFeed(){
  feed.innerHTML = '';
  if(!POSTS.length){
    feed.innerHTML = '<div class="empty-feed">Le carnet est vide.</div>';
    return;
  }
  POSTS.forEach(post => {
  const card = document.createElement('article');
  const kind = post.kind || 'entry';
  card.className = 'post ' + kind; card.id = post.id;
  const hasVocab = !!(post.vocab && post.vocab.length), hasGram = !!(post.gram && post.gram.length);

  // Sentences are wrapped only when the entry ships a `simple` block that matches the split
  // (a data slip must never break plain reading).
  const simpleOK = hasSimple(post);
  const ptext = (p,i) => simpleOK
    ? splitSentences(p).map((t,j) => `<span class="sent" data-sent="${i}:${j}">${t}</span>`).join(' ')
    : p;
  const frHTML = post.fr.map((p,i) =>
    `<p>`+
      `<button class="pp-btn learn-only" data-play="para" data-id="${post.id}" data-i="${i}" aria-label="Lire">${ICON_PLAY}</button>`+
      `<button class="dict-btn learn-only" data-dict="${post.id}:${i}" aria-label="Dictée" title="Dictée — écouter et écrire">${ICON_PEN}</button>`+
      `<span class="ptext">${ptext(p,i)}</span>`+
      `<span class="dictation">`+
        `<textarea class="dict-input" rows="3" placeholder="Écoutez (▶) et écrivez ce que vous entendez…"></textarea>`+
        `<span class="dict-actions">`+
          `<button class="dict-check" data-check="${post.id}:${i}">Vérifier</button>`+
          `<button class="dict-reveal" data-reveal="${post.id}:${i}">Afficher le texte</button>`+
        `</span>`+
        `<span class="dict-result"></span>`+
      `</span>`+
    `</p>`).join('');
  const enHTML = post.en.map(p => `<p>${p}</p>`).join('');
  const vocabRows = (post.vocab||[]).map((v,vi) => {
    const conj = v[2];                                 // present only on verb entries
    const btn = conj ? ` <button class="conj-btn" data-conj="${post.id}:${vi}" aria-label="Voir la conjugaison" title="Conjugaison">▾</button>` : '';
    let row = `<tr><td class="fr">${v[0]}${btn}</td><td class="en">${v[1]}</td></tr>`;
    if(conj){
      const tenses = conj.conj.map(t =>
        `<div class="conj-tense"><div class="conj-tname">${t[0]}</div><ul>${t[1].map(f=>`<li>${f}</li>`).join('')}</ul></div>`).join('');

// ── SIMPLIFY ──
function hasSimple(post){
  if(!Array.isArray(post.simple) || post.simple.length !== post.fr.length) return false;
  return post.fr.every((p,i) => Array.isArray(post.simple[i]) && post.simple[i].length === splitSentences(p).length);
}
function clearSimple(postEl){
  postEl.classList.remove('simple-on');
  postEl.querySelectorAll('.sent.on').forEach(s => s.classList.remove('on'));
  postEl.querySelectorAll('.simp-para').forEach(p => { p.innerHTML = ''; });
  const block = postEl.querySelector('.simple-block'); if(block) block.classList.remove('has-items');
}
function renderSimplePara(postEl, post, i){
  const slot = postEl.querySelector(`.simp-para[data-i="${i}"]`); if(!slot) return;

}

const AUDIO_CACHE = new Map();
let curAudio=null, curUtter=null, seqToken=0, speed=1, activePlayer=null;

async function fetchTTS(text){
  const key=getLS(KEY_API), vid=getLS(KEY_VOICE);
  if(!key||!vid) return null;
  const ck = vid+'|'+text;
  if(AUDIO_CACHE.has(ck)) return AUDIO_CACHE.get(ck);
  try{
    const res=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vid}`,{method:'POST',
      headers:{'xi-api-key':key,'Content-Type':'application/json'},
      body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.75}})});
    if(!res.ok) return null;
    const url=URL.createObjectURL(await res.blob());
    AUDIO_CACHE.set(ck,url);
    return url;
  }catch(e){ return null; }
}

function clearPlayingUI(){
  document.querySelectorAll('.pp-btn').forEach(b=>{ b.classList.remove('playing'); b.innerHTML=ICON_PLAY; });
  document.querySelectorAll('.article p.speaking').forEach(p=>p.classList.remove('speaking'));
  document.querySelectorAll('.act-read').forEach(b=>{ b.classList.remove('playing'); b.textContent='Lire'; });
}
function stopAll(){
  seqToken++;
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  if(window.speechSynthesis){ try{speechSynthesis.cancel();}catch(e){} }
  curUtter=null; activePlayer=null; clearPlayingUI();
}

function playOne(text,my,btn){
  return new Promise(resolve=>{
    const done=()=>resolve();
    const key=getLS(KEY_API), vid=getLS(KEY_VOICE);
    const fallback=()=>{
      if(my!==seqToken) return done();
      if(!('speechSynthesis' in window)) return done();
      try{speechSynthesis.cancel();}catch(e){}
      const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=Math.max(.5,Math.min(1.3,speed*0.95));
      const vs=speechSynthesis.getVoices(); const fr=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('fr')); if(fr)u.voice=fr;
      if(btn)btn.innerHTML=ICON_STOP;
      u.onend=done; u.onerror=done; curUtter=u; speechSynthesis.speak(u);
    };
    const start=(url)=>{
      if(my!==seqToken) return done();
      const a=new Audio(url); a.playbackRate=speed; curAudio=a;
      if(btn)btn.innerHTML=ICON_STOP;
      a.onended=done; a.onerror=()=>fallback();
      a.play().catch(()=>fallback());
    };
    if(key&&vid){ fetchTTS(text).then(url=>{ if(my!==seqToken)return done(); url?start(url):fallback(); }).catch(fallback); }
    else fallback();
  });
}

async function speakSequence(items){
  const my=++seqToken;
  for(let i=0;i<items.length;i++){
    if(my!==seqToken) return;
    const {text,para,btn}=items[i];
    if(para) para.classList.add('speaking');
    if(btn){ btn.classList.add('playing'); btn.innerHTML=ICON_SPIN; }
    if(items[i+1]) fetchTTS(items[i+1].text);
    await playOne(text,my,btn);
    if(para) para.classList.remove('speaking');
    if(btn){ btn.classList.remove('playing'); btn.innerHTML=ICON_PLAY; }
    if(my!==seqToken) return;
  }
}

function onPlay(btn){
  const kind=btn.dataset.play, id=btn.dataset.id;
  const playerId = [kind,id,btn.dataset.i,btn.dataset.j].filter(x=>x!=null).join(':');
  if(activePlayer===playerId){ stopAll(); return; }
  stopAll();
  activePlayer=playerId;
  const post=POSTS.find(p=>p.id===id);
  const cardEl=document.getElementById(id);
  const paras=[...cardEl.querySelectorAll('.article p')];
  const ppBtns=[...cardEl.querySelectorAll('.pp-btn')];
  let items;
  if(kind==='all'){
    items=post.fr.map((t,i)=>({text:t,para:paras[i],btn:ppBtns[i]}));
    btn.classList.add('playing'); btn.textContent='Arrêter';
  } else if(kind==='simple'){
    items=[{text:post.simple[+btn.dataset.i][+btn.dataset.j].fr,btn}];
  } else {
    const i=+btn.dataset.i; items=[{text:post.fr[i],para:paras[i],btn:ppBtns[i]}];
  }
  speakSequence(items).then(()=>{ if(activePlayer===playerId) stopAll(); });
}

// ── DICTATION ──
// Each paragraph has a ✎ button that hides the text and shows a typing box. The
// learner plays the audio with the paragraph's ▶ button, writes what they hear,
// and "Vérifier" scores it with a word-by-word diff against the original.
function escHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dictTokenize(s){ return s.trim().split(/\s+/).filter(Boolean); }
// Compare-key for a token: lowercase, straight apostrophes, strip edge punctuation
// (accents are kept significant — they're part of learning to spell French).
function dictNorm(t){
  return t.toLowerCase().replace(/[’]/g,"'")
    .replace(/^[^0-9a-zà-ÿœæ']+|[^0-9a-zà-ÿœæ']+$/gi,'');
}
// Longest-common-subsequence alignment → which expected/typed tokens matched.
function dictAlign(expTok, usrTok){
  const a = expTok.map(dictNorm), b = usrTok.map(dictNorm);
  const n = a.length, m = b.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const expMatch = new Array(n).fill(false), usrMatch = new Array(m).fill(false);
  let i=0, j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ expMatch[i]=usrMatch[j]=true; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++;
    else j++;
  }
  return {expMatch, usrMatch};
}
function checkDictation(box, expectedText){
  const res = box.querySelector('.dict-result');
  const rb = box.querySelector('.dict-reveal');             // a check result replaces any reveal
  if(rb){ rb.classList.remove('on'); rb.textContent = 'Afficher le texte'; }
  const typed = box.querySelector('.dict-input').value;
  const expTok = dictTokenize(expectedText), usrTok = dictTokenize(typed);
  res.classList.add('open');
  if(!usrTok.length){ res.innerHTML = '<span class="dict-msg">Écrivez d\'abord ce que vous entendez.</span>'; return; }
  const {expMatch, usrMatch} = dictAlign(expTok, usrTok);
  const correct = expMatch.filter(Boolean).length;
  const pct = Math.round(correct / expTok.length * 100);
  const expHTML = expTok.map((t,k) => `<span class="${expMatch[k]?'w-ok':'w-miss'}">${escHTML(t)}</span>`).join(' ');
  const usrHTML = usrTok.map((t,k) => `<span class="${usrMatch[k]?'w-ok':'w-bad'}">${escHTML(t)}</span>`).join(' ');
  res.innerHTML =
    `<span class="dict-score">${correct} / ${expTok.length} mots · ${pct} %</span>`+
    `<span class="dict-lbl">Texte original</span><span class="dict-line">${expHTML}</span>`+
    `<span class="dict-lbl">Votre réponse</span><span class="dict-line">${usrHTML}</span>`;
}

// ── SELECTION DICTIONARY ──
// Select French text inside an entry → a small floating popup gives a quick gloss.
// Sources, in order: the entries' own curated vocab (instant, offline) → English
// Wiktionary's French section for single words (real senses + part of speech, follows
// "form of" links) → Google Translate's public endpoint for phrases → MyMemory as a last
// resort. All are CORS-enabled, keyless, and work when the file is opened via file://.
const LOOKUP_CACHE = new Map();        // normalized term -> {trans, src}
let lookupEl = null, lookupSeq = 0;

// Normalize for matching/caching: lowercase, straighten apostrophes, drop punctuation.
function normTerm(s){
  return s.toLowerCase()
    .replace(/[’]/g,"'")
    .replace(/[.,;:!?«»"“”()\[\]…]/g,'')
    .replace(/\s+/g,' ').trim();
}

// Gloss map from the vocab of every entry (incl. verb infinitives).
function vocabIndex(){
  const idx = new Map();
  POSTS.forEach(p => (p.vocab||[]).forEach(v => {
    const k = normTerm(v[0]); if(k && !idx.has(k)) idx.set(k, v[1]);
    if(v[2] && v[2].inf){ const ik = normTerm(v[2].inf); if(ik && !idx.has(ik)) idx.set(ik, v[1]); }
  }));
  return idx;
}

function ensureLookupEl(){
  if(lookupEl) return lookupEl;
  lookupEl = document.createElement('div');
  lookupEl.className = 'lookup';
  document.body.appendChild(lookupEl);
  lookupEl.addEventListener('mousedown', e => e.preventDefault());  // don't drop the selection
  return lookupEl;
}
function hideLookup(){ lookupSeq++; if(lookupEl) lookupEl.classList.remove('open'); }

function positionLookup(rect){
  const el = lookupEl, w = el.offsetWidth, h = el.offsetHeight;
  let left = rect.left + rect.width/2 - w/2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = rect.top - h - 10;                  // prefer above the selection
  if(top < 8) top = rect.bottom + 10;           // flip below if there's no room
  el.style.left = left+'px'; el.style.top = top+'px';
}

function renderLookup(term, bodyHTML, rect){
  const el = ensureLookupEl();
  el.innerHTML =
    `<div class="lk-head"><div class="lk-term">${term}</div>`+
    `<button class="lk-speak" aria-label="Écouter">${ICON_PLAY}</button></div>`+
    `<div class="lk-body">${bodyHTML}</div>`;
  el.classList.add('open');
  positionLookup(rect);
  el.querySelector('.lk-speak').onclick = () => {
    stopAll();
    const b = el.querySelector('.lk-speak'); b.classList.add('playing'); b.innerHTML = ICON_STOP;
    speakSequence([{text:term}]).then(() => { b.classList.remove('playing'); b.innerHTML = ICON_PLAY; });
  };
}

// Clean a selection for lookup: straight apostrophes, no surrounding punctuation/quotes.
function cleanTerm(s){
  return s.replace(/[’]/g,"'")
    .replace(/^[\s.,;:!?«»"“”()\[\]…—–-]+|[\s.,;:!?«»"“”()\[\]…—–-]+$/g,'')
    .replace(/\s+/g,' ').trim();
}
function sameAs(a,b){ return normTerm(a)===normTerm(b); }
function stripHTML(h){ return h.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
const ELISION = /^(l|d|j|n|s|c|m|t|qu)'(?=\S)/i;

// 1) English Wiktionary, French section: real dictionary senses with part of speech.
//    Inflected forms come back as "past participle of replier" → we follow the link once
//    and append the base word's first sense. Tries: as typed, lowercased, without elision.
async function wiktionaryOne(word, depth){
  try{
    const res = await fetch(`https://en.wiktionary.org/api/rest_v1/page/definition/${encodeURIComponent(word)}`);
    if(!res.ok) return null;
    const data = await res.json();
    const fr = data && data.fr; if(!Array.isArray(fr) || !fr.length) return null;
    const senses = [];
    for(const e of fr.slice(0,2)){
      const defs = (e.definitions||[]).map(d => stripHTML(d.definition||'')).filter(Boolean).slice(0,2);
      if(!defs.length) continue;
      let line = defs.join('; ');
      const m = depth===0 && / of ([^\s,;()]+)$/.exec(defs[0]);
      if(m){ const base = await wiktionaryOne(m[1], 1); if(base && base.first) line += ' → ' + base.first; }
      senses.push({pos:(e.partOfSpeech||'').toLowerCase(), line});
    }
    if(!senses.length) return null;
    return { first: senses[0].line, html: senses.map(x => `<div class="lk-sense"><span class="lk-pos">${escHTML(x.pos)}</span>${escHTML(x.line)}</div>`).join('') };
  }catch(e){ return null; }
}
async function wiktionary(word){
  const tries = [word];
  if(word.toLowerCase()!==word) tries.push(word.toLowerCase());
  const el = word.replace(ELISION,''); if(el!==word){ tries.push(el); tries.push(el.toLowerCase()); }
  for(const w of [...new Set(tries)]){
    const r = await wiktionaryOne(w, 0);
    if(r) return {trans:r.html, src:'Wiktionnaire' + (w!==word ? ` · ${escHTML(w)}` : '')};
  }
  return null;
}
// 2) Google Translate's public endpoint (phrases). Unofficial, so treated as best-effort.
async function googleTranslate(term){
  try{
    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=en&dt=t&q=${encodeURIComponent(term)}`);
    if(!res.ok) return null;
    const d = await res.json();
    const t = ((d && d[0]) || []).map(x => x && x[0]).filter(Boolean).join('').trim();
    return (t && !sameAs(t, term)) ? {trans:escHTML(t), src:'Google Traduction'} : null;
  }catch(e){ return null; }
}
// 3) MyMemory translation memory. Rejected when it echoes the source or the match is weak.
async function myMemory(term){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(term)}&langpair=fr|en&de=arqbcode2026@gmail.com`);
    const data = await res.json();
    const rd = data && data.responseData; const t = rd && rd.translatedText;
    if(!t || sameAs(t, term) || (typeof rd.match==='number' && rd.match < 0.5)) return null;
    return {trans:escHTML(t), src:'MyMemory'};
  }catch(e){ return null; }
}

async function lookupTranslate(raw){
  const term = cleanTerm(raw); if(!term) return {trans:null, src:null};
  const key = normTerm(term);
  if(LOOKUP_CACHE.has(key)) return LOOKUP_CACHE.get(key);
  const remember = r => { LOOKUP_CACHE.set(key, r); return r; };
  const hit = vocabIndex().get(key);                                   // 0) curated vocab (offline, instant)
  if(hit) return remember({trans:hit, src:'Vocabulaire de la note'});
  const single = !/\s/.test(term);
  let r = null;
  if(single) r = await wiktionary(term);                                // 1) dictionary
  if(!r) r = await googleTranslate(term);                               // 2) translation
  if(!r) r = await myMemory(term);                                      // 3) last resort
  return remember(r || {trans:null, src:null});
}

function runLookup(){
  if(!document.body.classList.contains('learn')){ hideLookup(); return; }
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount){ hideLookup(); return; }
  const raw = sel.toString().trim().replace(/\s+/g,' ');
  if(!raw || raw.length>80 || raw.split(' ').length>10){ hideLookup(); return; }
  const node = sel.anchorNode;
  const host = node && (node.nodeType===1 ? node : node.parentElement);
  if(!host || !host.closest('.article, .simp-fr')){ hideLookup(); return; }   // the French reading text, or a simplified sentence
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if(!rect || (!rect.width && !rect.height)){ hideLookup(); return; }
  const my = ++lookupSeq;
  renderLookup(raw, '<span class="lk-loading">…</span>', rect);
  lookupTranslate(raw).then(r => {
    if(my!==lookupSeq || !lookupEl) return;
    const body = lookupEl.querySelector('.lk-body');
    body.innerHTML = r.trans
      ? `<div class="lk-trans">${r.trans}</div><div class="lk-src">${r.src}</div>`
      : '<div class="lk-trans none">Pas de traduction trouvée.</div>';
    positionLookup(rect);                          // re-measure now that content changed
  });
}

// Desktop reacts on mouse-up. Touch devices don't fire a reliable mouse-up at the
// end of a text selection (you drag the selection handles), so once a touch is seen
// we switch to a debounced `selectionchange` that waits for the handles to settle.
let touchMode = false, selDebounce = null;
document.addEventListener('mouseup', e => {
  if(lookupEl && lookupEl.contains(e.target)) return;
  if(touchMode) return;                            // touch is handled via selectionchange
  setTimeout(runLookup, 0);                        // let the selection settle first
});
document.addEventListener('mousedown', e => {
  if(lookupEl && lookupEl.contains(e.target)) return;
  hideLookup();
});
document.addEventListener('touchstart', e => {
  touchMode = true;
  if(lookupEl && lookupEl.contains(e.target)) return;   // taps inside the popup keep it open
  hideLookup();
}, {passive:true});
document.addEventListener('selectionchange', () => {
  if(!touchMode) return;
  clearTimeout(selDebounce);
  selDebounce = setTimeout(runLookup, 420);        // wait out the selection-handle drag
});
document.addEventListener('keydown', e => { if(e.key==='Escape') hideLookup(); });
window.addEventListener('scroll', hideLookup, true);

// ── INIT ──
window.addEventListener('load', () => {
  setLearn(getLS(KEY_LEARN)==='1');   // plain diary by default
  showAll();                  // load + render every entry, oldest first
  const s=parseFloat(getLS(KEY_SPEED)); if(!isNaN(s)) speed=s;
  if(window.speechSynthesis) speechSynthesis.getVoices();
  const key=getLS(KEY_API);
  if(key) fetchVoices(key,false);
  refreshReadbar();
});
</script>
